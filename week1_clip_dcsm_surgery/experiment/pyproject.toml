[project]
name = "dcsm-surgery"
version = "0.2.0"
description = "Frozen CLIP + last-block readout surgery + DCSM scoring network for failure-mode (attribute / spatial-relationship / negation) referring detection, compared with OWL-ViT, OWLv2 and Grounding DINO"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "pillow",
    "numpy",
    "matplotlib",
    "scipy",
    "pycocotools",
    "gdown",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dcsm_surgery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Blackwell (sm_120) GPUs need the cu128 torch build.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
