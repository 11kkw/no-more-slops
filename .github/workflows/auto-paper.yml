name: Auto-Paper local tools
on:
  pull_request:
    paths: ['skills/research/**', 'examples/auto-paper/**', 'tests/auto-paper/**', '.github/workflows/auto-paper.yml']
  push:
    paths: ['skills/research/**', 'examples/auto-paper/**', 'tests/auto-paper/**', '.github/workflows/auto-paper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r skills/research/paper-review-local/scripts/requirements-mcp.txt
      - run: sudo apt-get update && sudo apt-get install -y chktex
      - run: python -B -m unittest discover -s tests/auto-paper -v
